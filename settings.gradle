pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

// Port target: NeoForge only. The fabric/ and forge/ subprojects remain on disk (and in git
// history) but are not included in the build. Re-add include("fabric") to revive Fabric later.
include("common")
include("neoforge")

rootProject.name = "FossilsArcheologyRevival"
