# Access Transformer for NeoForge production runtime.
# Hand-maintained mirror of common/src/main/resources/fossil.accesswidener — architectury-loom
# applies the widener in dev, but does NOT emit an AT into the shipped jar, and NeoForge cannot
# read access wideners. Keep these two files in sync. NeoForge auto-loads this canonical path.
# Names are Mojang-mapped (NeoForge 1.20.2+ runs Mojang mappings in production).

