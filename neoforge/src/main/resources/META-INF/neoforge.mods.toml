modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"

license = "${mod_license}"
issueTrackerURL = "https://github.com/TeamFossilsArcheology/FossilsArcheologyRevival/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/fossils"
logoFile = "fossils.png"
credits = "Original mod by Flammarilva and Team July!"
authors = "${neoforge_mod_authors}"
description = "${mod_description}"

[[mixins]]
config = "fossil_common.mixins.json"

[[mixins]]
config = "fossil_neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version_range_lower},${minecraft_version_range_upper})"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[13.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.7.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "terrablender"
type = "required"
versionRange = "[4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "morehitboxes"
type = "required"
versionRange = "[1.9.4,)"
ordering = "AFTER"
side = "BOTH"

# --- Optional integrations (re-enable in Phase 3 once their 1.21.1 builds are wired in) ---
[[dependencies.${mod_id}]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "[16,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1,)"
ordering = "NONE"
side = "BOTH"

[modproperties.${mod_id}]
catalogueImageIcon = "fossils.png"
